eight&quot;:&quot;0&quot;}], programs: [{&quot;name&quot;:&quot;Accounting - BAC&quot;,&quot;types&quot;:[&quot;5146&quot;],&quot;school&quot;:&quot;4631&quot;,&quot;area&quot;:[&quot;5296&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;Students in the accounting program&amp;nbsp;can expect to learn about important concepts like financial analysis, budgeting and taxation; serve as the primary liaison between business entities and their stakeholders; and develop a comprehensive information system, which is in high demand by employers.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;Pursuing an accounting degree will also give you the chance to pursue a career as an auditor, an active deterrent to managerial malfeasance. You will be the gatekeeper, preserving the integrity of the business market and upholding the principles of responsible governance. Successful completion of this program can open doors to a wide range of career opportunities, including positions in accounting firms, financial services and corporate finance departments.&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;Additionally, the program opens doors to networking with alumni and industry professionals, who can provide valuable insights into the program's strengths and help students make informed decisions about their future.&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;Other Degrees to Consider&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu//academics/undergraduate-programs/accounting-minor\&quot; target=\&quot;_blank\&quot;&gt;Minor in Accounting&amp;nbsp;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;Related Programs&lt;/strong&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/management-information-and-communication-technology\&quot; target=\&quot;_blank\&quot;&gt;Management of Information and Communication Technology (MICT)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/finance\&quot; target=\&quot;_blank\&quot;&gt;Bachelor of Business in Finance (BBF)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/business-and-entrepreneurship\&quot; target=\&quot;_blank\&quot;&gt;Bachelor of Business and Entrepreneurship (BBE)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/marketing\&quot; target=\&quot;_blank\&quot;&gt;Bachelor of Business in Marketing (BBM)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu//academics/graduate-programs/business-administration-mba\&quot; target=\&quot;_blank\&quot;&gt;Master of Business Administration (MBA)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu//academics/graduate-programs/executive-mba\&quot; target=\&quot;_blank\&quot;&gt;Executive Master of Business Administration (EMBA)&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu//academics/graduate-programs/international-management-cems\&quot; target=\&quot;_blank\&quot;&gt;Master in International Management (MIM/CEMS)&lt;/a&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/accounting&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2023-03/accounting_220925_2156.jpg?itok=9s-vFUN6&quot;,&quot;alt&quot;:&quot;Smiling students in classroom&quot;},&quot;weight&quot;:&quot;14&quot;},{&quot;name&quot;:&quot;Computer Engineering, with Specializations in Embedded Systems, Artificial Intelligence and Cybersecurity - BS&quot;,&quot;types&quot;:[&quot;5131&quot;],&quot;school&quot;:&quot;4701&quot;,&quot;area&quot;:[&quot;5306&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;Computer engineering is the discipline that embodies the science and technology of the design, construction, implementation and maintenance of the software and hardware components of modern computing systems and computer-controlled equipment.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;The program provides the foundation and areas of specialization necessary to analyze, design and evaluate systems software, middleware and software/hardware architectures and interfaces. The specific objectives of the program are to: educate students with a breadth of knowledge in computer engineering that would allow them to contribute to computing projects individually or as members of multidisciplinary teams with emphasis on the creative applications of scientific knowledge in the analysis, design, and implementation of economical computer software and hardware systems; introduce students to a broad spectrum of computer engineering topics, with concentration in one or more computing areas of their choice; prepare students to cope with, and improve on, the ever-evolving discipline of computer engineering and state-of-the-art technologies in the industry of software and hardware systems. &amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;Applicants to the Bachelor of Science in Computer Engineering program should generally have strong analytical, mathematical and problem-solving skills, as well as a strong interest in engineering and computer science.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;The Computer Engineering (B.S.) program&lt;/strong&gt;&lt;span&gt;&lt;strong&gt;&amp;nbsp;is accredited by the Engineering Accreditation Commission of ABET,&amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;a href=\&quot;https://www.abet.org/\&quot; target=\&quot;_blank\&quot;&gt;&lt;strong&gt;https://www.abet.org&lt;/strong&gt;&lt;/a&gt;&lt;span&gt;&lt;strong&gt;, under the commission's General Criteria and the Program Criteria for the Electrical, Computer, Communications, Telecommunication(s) and Similarly Named Engineering Programs.&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;&lt;img src=\&quot;/sites/default/files/inline-images/EAC-RGB-B-S_1_10.png\&quot; data-entity-uuid=\&quot;8b3993c5-4c00-4834-9da1-16f8acb8c334\&quot; data-entity-type=\&quot;file\&quot; width=\&quot;207\&quot; height=\&quot;90\&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Specializations&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li data-list-item-id=\&quot;e4a81ca9e3d9c6572ef18ec47eb109706\&quot;&gt;Embedded Systems&lt;/li&gt;&lt;li data-list-item-id=\&quot;edd1cd8345ea0932146c3af33f8b0183b\&quot;&gt;Artificial Intelligence&lt;/li&gt;&lt;li data-list-item-id=\&quot;ef42571bfb5ca0f14c327876ac3a46b96\&quot;&gt;Cybersecurity&lt;/li&gt;&lt;/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;Other Degrees to Consider&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/computer-science-minor\&quot;&gt;&lt;span&gt;Computer Science Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;Related Programs&lt;/strong&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/computer-science\&quot;&gt;&lt;span&gt;Bachelor of Science in Computer Science (BS)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/data-science\&quot;&gt;&lt;span&gt;Bachelor of Science in Data Science (BSc)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computer-science-diploma\&quot;&gt;&lt;span&gt;Computer Science Diploma&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computer-science-msc\&quot;&gt;&lt;span&gt;Master of Science in Computer Science (MSc)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computing-m-comp\&quot;&gt;&lt;span&gt;Master in Computing (MComp)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/applied-sciences-phd\&quot;&gt;&lt;span&gt;Doctorate of Philosophy in Engineering (PhD)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/computer-engineering&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2023-03/computer_engineering_181002_7r27478.jpg?itok=GebcTyUR&quot;,&quot;alt&quot;:&quot;close up on student hand working with electrical board &quot;},&quot;weight&quot;:&quot;14&quot;},{&quot;name&quot;:&quot;Computer Science, with Specializations in Embedded Systems, Artificial Intelligence and Cybersecurity - BS&quot;,&quot;types&quot;:[&quot;5131&quot;],&quot;school&quot;:&quot;4701&quot;,&quot;area&quot;:[&quot;5306&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;The computer science and engineering program at AUC provides students with a modern education, emphasizing the creative application of scientific knowledge in the analysis, design and implementation of computer software and hardware systems. The ABET-accredited&amp;nbsp;program develops students’ skills in theory and practice and raises their awareness of the social implications of applying their work. Computing ethics and professionalism are important ingredients of the program and are emphasized at all levels.&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;A bachelor's degree in computer science can provide an excellent foundation for a career in the field and prepare students to handle the rapidly evolving and exciting challenges and opportunities in computing.&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;strong&gt;The Computer Science (B.S.) program&lt;/strong&gt;&lt;span&gt;&lt;strong&gt;&amp;nbsp;is accredited by the Computing Accreditation Commission of ABET,&amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;a href=\&quot;https://www.abet.org/\&quot; target=\&quot;_blank\&quot;&gt;&lt;strong&gt;https://www.abet.org&lt;/strong&gt;&lt;/a&gt;&lt;span&gt;&lt;strong&gt;, under the commission's General Criteria and the Program Criteria for the Computer Science and Similarly Named Computing Programs.&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;img src=\&quot;/sites/default/files/inline-images/AppliedScience_RGB_S_5_0.jpg\&quot; data-entity-uuid=\&quot;8be68eef-2bb8-423e-a718-e9a113e9ff62\&quot; data-entity-type=\&quot;file\&quot; width=\&quot;21.15%\&quot; height=\&quot;21.15%\&quot;&gt;&lt;h3&gt;&lt;strong&gt;Specializations&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li data-list-item-id=\&quot;e31446f95a7410cb2539985dd11cc1a0b\&quot;&gt;Embedded Systems&lt;/li&gt;&lt;li data-list-item-id=\&quot;e4fc847a55a90bf8a5dfc40076760915c\&quot;&gt;Artificial Intelligence&lt;/li&gt;&lt;li data-list-item-id=\&quot;ed3e66cde89c1d8e063e1ab3621053e55\&quot;&gt;Cybersecurity&amp;nbsp;&lt;/li&gt;&lt;/ul&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;&lt;strong&gt;Other Degrees to Consider&amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/computer-science-minor\&quot;&gt;&lt;span&gt;Computer Science Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;&lt;strong&gt;Related Programs&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/computer-engineering\&quot;&gt;&lt;span&gt;Bachelor of Science in Computer Engineering (BS)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/data-science\&quot;&gt;&lt;span&gt;Bachelor of Science in Data Science (BSc)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computer-science-diploma\&quot;&gt;&lt;span&gt;Computer Science Diploma&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computer-science-msc\&quot;&gt;&lt;span&gt;Master of Science in Computer Science (MSc)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/computing-m-comp\&quot;&gt;&lt;span&gt;Master in Computing (MComp)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/engineering-phd\&quot;&gt;&lt;span&gt;Doctorate of Philosophy in Engineering (PhD)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/computer-science&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2023-03/computer_science_220925_3252.jpg?itok=kGYfEQ76&quot;,&quot;alt&quot;:&quot;student wearing VR and working with the equipment&quot;},&quot;weight&quot;:&quot;14&quot;},{&quot;name&quot;:&quot;Economics - BA&quot;,&quot;types&quot;:[&quot;5126&quot;],&quot;school&quot;:&quot;4631&quot;,&quot;area&quot;:[&quot;5296&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;At the heart of an economics degree is the desire to understand and improve how societies function. As an economics student, you will gain a deeper understanding of how economic systems work and how different policies and decisions can impact them. You will also be challenged to think creatively and critically about complex problems and develop innovative solutions.&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;Economics is the study of how societies allocate scarce resources, and it touches on everything from global financial systems to individual decision making. During your studies, you will learn about economic development, policymaking and econometric theory and gain an appreciation and lucid perception of the interdependence of world economic systems and their application in financial economies.&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;&lt;strong&gt;Other Degrees to Consider&amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/economics-minor\&quot;&gt;&lt;span&gt;Economics Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/accounting-minor\&quot;&gt;&lt;span&gt;Accounting Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/business-administration-minor\&quot;&gt;&lt;span&gt;Business Administration Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;span&gt;&lt;strong&gt;Related Programs&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/economics-international-development-diploma\&quot;&gt;&lt;span&gt;Economics in International Development Diploma&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/accounting\&quot;&gt;&lt;span&gt;Bachelor of Accounting (BAC)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/economics-international-development-ma\&quot;&gt;&lt;span&gt;Master of Arts in Economics in International Development (MA)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/business-administration-mba\&quot;&gt;&lt;span&gt;Master of Business Administration (MBA)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/executive-mba\&quot;&gt;&lt;span&gt;Executive Master of Business Administration (EMBA)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;MsoNormal\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/master-international-management-cems\&quot;&gt;&lt;span&gt;Master in International Management/CEMS (MIM/CEMS)&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/economics&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2026-02/5-231014_4093_0.jpg?itok=Tq3ZOz8k&quot;,&quot;alt&quot;:&quot;A student presents ideas at a whiteboard while classmates use laptops and tablets during a group session.&quot;},&quot;weight&quot;:&quot;14&quot;},{&quot;name&quot;:&quot;Film - BA&quot;,&quot;types&quot;:[&quot;5126&quot;],&quot;school&quot;:&quot;4671&quot;,&quot;area&quot;:[&quot;5286&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;AUC’s film program is the only university-level program in Egypt and the Arab region that offers a comprehensive and balanced study of filmmaking, production, film theory, criticism and industry. Uniquely situated in the&lt;/span&gt;&lt;strong&gt; “film” city of Cairo&lt;/strong&gt;&lt;span&gt;, the Egyptian film industry has a long and storied history, dating back to the early 20th century. Over the years, it has produced countless iconic films and legendary actors and has become an important cultural force in the region.&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;AUC’s film program integrates formal film production training with the study of the historical, aesthetic, and theoretical foundations of the medium, providing students with an understanding of how various practical and aesthetic aspects of contemporary cinematic culture interact and eventually integrate various local, regional and international influences.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;strong&gt;Other Degrees to Consider&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/film-minor\&quot;&gt;&lt;span&gt;Film Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/writing\&quot;&gt;&lt;span&gt;Writing Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;a href=\&quot;https://www.aucegypt.edu/academics/undergraduate-programs/theatre-minor\&quot;&gt;&lt;span&gt;Theatre Minor&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/film&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2026-02/7-20241028_1557.jpg?itok=9sSO_hPn&quot;,&quot;alt&quot;:&quot;A student wearing headphones operates a professional video camera on a tripod in a studio setting.&quot;},&quot;weight&quot;:&quot;14&quot;},{&quot;name&quot;:&quot;Computer Science - Minor&quot;,&quot;types&quot;:[&quot;5186&quot;],&quot;school&quot;:&quot;4701&quot;,&quot;area&quot;:[&quot;5306&quot;],&quot;location&quot;:[],&quot;tags&quot;:[],&quot;description&quot;:&quot;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;AUC’s broad-based liberal arts education allows you to diversify your learning with a minor or two — helping you develop skills complementary to your primary area of study and demonstrating to potential employers that you have range.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;span&gt;In all engineering and scientific disciplines, computational thinking is a crucial skill. The Computer Science minor offers comprehensive coverage of the field and the opportunity to explore areas of personal interest. By the end of the program, you'll have gained the computing knowledge and skills to enable you to develop simple or advanced applications in your field of study.&lt;/span&gt;&lt;/p&gt;&quot;,&quot;links&quot;:[{&quot;href&quot;:&quot;/academics/undergraduate-programs/computer-science-minor&quot;,&quot;innerHTML&quot;:&quot;See Program Details&quot;},{&quot;href&quot;:&quot;https://aucegypta.my.salesforce-sites.com/requestforinformation?LeadSource=Web&quot;,&quot;innerHTML&quot;:&quot;Request Info&quot;}],&quot;image&quot;:{&quot;src&quot;:&quot;https://www.aucegypt.edu/sites/default/files/styles/large/public/2023-05/computerscience_220925_6572.jpg?itok=6m6PEwDN&quot;,&quot;alt&quot;:&quot;A corridor with two students trying out a robot&quot;},&quot;weight&quot;:&quot;27&quot;}], display: 12, query: '' }"><h2>All Programs</h2></section></main></body></html>
